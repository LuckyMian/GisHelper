[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gismapshelper"
version = "0.3.0"
description = "GIS 地图处理工具（开发中）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.7", "rasterio>=1.5", "numpy>=2.0", "ezdxf>=1.4"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pyinstaller>=6.11",
]

[project.scripts]
gismaps-helper = "gismapshelper.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
packages = ["gismapshelper"]
mypy_path = "src"
ignore_missing_imports = true
